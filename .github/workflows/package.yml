name: Native packages

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build Linux GUI and CLI
        run: PYTHON_BIN="$(command -v python)" ./packaging/linux/build_linux.sh --clean
      - uses: actions/upload-artifact@v4
        with:
          name: LIF2TIFF-Linux-x86_64
          path: |
            packaging/linux/release/*.tar.gz
            packaging/linux/release/*.sha256
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build Windows GUI and CLI
        shell: powershell
        run: .\packaging\windows\build_windows.ps1 -Clean
      - uses: actions/upload-artifact@v4
        with:
          name: LIF2TIFF-Windows-x64
          path: |
            packaging/windows/release/*.zip
            packaging/windows/release/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "LIF2TIFF $TAG" \
            --generate-notes \
            --prerelease
